name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущую сборку — не тратим минуты зря.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Кэш Gradle (~/.gradle) и локальный build cache между запусками:
      # повторные сборки не скачивают зависимости заново и переиспользуют
      # результаты задач (compile*, dexBuilder, R8, aapt2).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      # Android SDK уже предустановлен на раннерах ubuntu-latest (ANDROID_HOME).
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --build-cache 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "--- строки с ошибками ---"
          grep -iE "^e: |error|aapt|not found|Caused by|Unresolved|Type mismatch|Missing class|R8" build.log | head -20 | while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | cut -c1-900)"; done
          echo "--- последние строки сборки ---"
          tail -40 build.log

      - name: Verify APK signature and size
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" > cert.txt 2>&1 || true
            echo "::notice::$(basename "$apk") signed by: $(grep -m1 'certificate DN' cert.txt)"
            echo "::notice::$(basename "$apk") SHA-256: $(grep -m1 'SHA-256 digest' cert.txt)"
            echo "::notice::$(basename "$apk") размер: $(du -h "$apk" | cut -f1)"
            python3 - "$apk" <<'PY'
          import collections
          import os
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              infos = archive.infolist()
          totals = collections.Counter()
          for info in infos:
              name = info.filename
              if name.startswith("classes") and name.endswith(".dex"):
                  key = "dex"
              elif name.startswith("lib/"):
                  key = "native"
              elif name.startswith("res/"):
                  key = "res"
              elif name == "resources.arsc":
                  key = "arsc"
              else:
                  key = "other"
              totals[key] += info.compress_size

          total = os.path.getsize(apk)
          print(f"::notice::APK: {total} байт ({total / 1024 / 1024:.2f} МБ)")
          summary = ", ".join(f"{k} {v / 1024:.0f} КБ" for k, v in totals.most_common())
          print(f"::notice::по категориям: {summary}")
          top = sorted(infos, key=lambda i: i.compress_size, reverse=True)[:5]
          biggest = " | ".join(f"{i.filename} {i.compress_size / 1024:.0f} КБ" for i in top)
          print(f"::notice::топ-5: {biggest}")
          PY
          done

      - name: Verify locales
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "=== пакет и версия ==="
          "$BUILD_TOOLS/aapt2" dump badging "$apk" | grep -m1 "^package:" || true
          "$BUILD_TOOLS/aapt2" dump badging "$apk" | grep -m1 "^package:" | sed 's/^/::notice::/' || true
          echo "=== конфигурации в resources.arsc ==="
          "$BUILD_TOOLS/aapt2" dump configurations "$apk" | tr ',' '\n' | sed 's/^ *//' | grep -E '^(be|ro|ru|uk|en)$' | sort -u
          DUMP=$("$BUILD_TOOLS/aapt2" dump resources "$apk")
          fail=0
          for pair in "be|Галоўная" "ro|Acasă" "ru|Главная" "uk|Головна" "en|Home"; do
            tag="${pair%%|*}"; word="${pair#*|}"
            if printf '%s' "$DUMP" | grep -qF "$word"; then
              echo "::notice::локаль $tag: найдено «$word»"
            else
              echo "::error::локаль $tag не попала в APK («$word» отсутствует)"
              fail=1
            fi
          done
          exit $fail

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ytd-lite-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
