# Параметры сборки: больше памяти R8 и инкрементальный Kotlin.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 в «полном» режиме — агрессивнее и быстрее, чем в compat-режиме.
android.enableR8.fullMode=true

kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2g
