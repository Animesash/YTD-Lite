# Единственное место, где хранятся версии проекта.
#
# Сюда смотрят корневой build.gradle.kts (плагины) и app/build.gradle.kts
# (зависимости, SDK и версия приложения). Новую библиотеку добавляем так:
#   1) версия — в [versions];
#   2) сама библиотека — в [libraries] с version.ref на эту версию;
#   3) в app/build.gradle.kts — libs.<имя-из-[libraries]>.

[versions]
# --- Сборка ---
agp = "8.6.1"
kotlin = "2.0.21"

# --- Версия приложения (versionCode / versionName) ---
versionCode = "2"
versionName = "v0.2.0-alpha"

# --- Android SDK ---
compileSdk = "35"
minSdk = "26"
targetSdk = "34"

# --- Библиотеки ---
coreKtx = "1.13.1"
recyclerview = "1.3.2"
activity = "1.9.2"
appcompat = "1.7.0"
material = "1.14.0"
fragment = "1.8.3"
lifecycle = "2.8.6"
coroutines = "1.9.0"
# yt-dlp внутри приложения: Python + yt-dlp + ffmpeg.
youtubedl = "0.18.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
# Material 3 Expressive
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
youtubedl-library = { module = "io.github.junkfood02.youtubedl-android:library", version.ref = "youtubedl" }
youtubedl-ffmpeg = { module = "io.github.junkfood02.youtubedl-android:ffmpeg", version.ref = "youtubedl" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
